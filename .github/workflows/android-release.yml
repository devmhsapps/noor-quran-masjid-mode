name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner
        run: |
          flutter create --platforms=android --project-name noor_quran_masjid_mode --org com.devmhs .
          rm -f test/widget_test.dart
      - name: Install Android native Masjid Mode code
        run: |
          cp tool/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/devmhs/noor_quran_masjid_mode
          cp tool/android/app/src/main/kotlin/com/devmhs/noor_quran_masjid_mode/*.kt android/app/src/main/kotlin/com/devmhs/noor_quran_masjid_mode/
          mkdir -p android/app/src/main/res/raw
          cp tool/android/app/src/main/res/raw/adhan.ogg android/app/src/main/res/raw/adhan.ogg
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i '/targetCompatibility = JavaVersion.VERSION_/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' >> android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
            sed -i '/targetCompatibility JavaVersion.VERSION_/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"\n}\n' >> android/app/build.gradle
          fi
      - name: Configure persistent Android release signing
        env:
          MUEEN_ANDROID_KEYSTORE_BASE64: ${{ secrets.MUEEN_ANDROID_KEYSTORE_BASE64 }}
          MUEEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MUEEN_ANDROID_KEYSTORE_PASSWORD }}
          MUEEN_ANDROID_KEY_ALIAS: ${{ secrets.MUEEN_ANDROID_KEY_ALIAS }}
          MUEEN_ANDROID_KEY_PASSWORD: ${{ secrets.MUEEN_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$MUEEN_ANDROID_KEYSTORE_BASE64"
          printf '%s' "$MUEEN_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/mueen-release.jks
          cat > android/key.properties <<EOF
          storePassword=$MUEEN_ANDROID_KEYSTORE_PASSWORD
          keyPassword=$MUEEN_ANDROID_KEY_PASSWORD
          keyAlias=$MUEEN_ANDROID_KEY_ALIAS
          storeFile=mueen-release.jks
          EOF
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/^android {/i\val keystoreProperties = java.util.Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))\n}\n' android/app/build.gradle.kts
            sed -i '/^[[:space:]]*buildTypes {/i\    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n' android/app/build.gradle.kts
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/' android/app/build.gradle.kts
          else
            sed -i '/^android {/i\def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n' android/app/build.gradle
            sed -i '/^[[:space:]]*buildTypes {/i\    signingConfigs {\n        release {\n            keyAlias keystoreProperties["keyAlias"]\n            keyPassword keystoreProperties["keyPassword"]\n            storeFile file(keystoreProperties["storeFile"])\n            storePassword keystoreProperties["storePassword"]\n        }\n    }\n' android/app/build.gradle
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' android/app/build.gradle
          fi
      - name: Install dependencies and run tests
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter test
      - name: Build universal release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: noor-quran-masjid-mode-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
