name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android runner
        run: |
          flutter create --platforms=android --project-name noor_quran_masjid_mode --org com.devmhs .
          rm -f test/widget_test.dart
      - name: Install Android native Masjid Mode code
        run: |
          cp tool/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/devmhs/noor_quran_masjid_mode
          cp tool/android/app/src/main/kotlin/com/devmhs/noor_quran_masjid_mode/*.kt android/app/src/main/kotlin/com/devmhs/noor_quran_masjid_mode/
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i '/targetCompatibility = JavaVersion.VERSION_/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' >> android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
            sed -i '/targetCompatibility JavaVersion.VERSION_/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"\n}\n' >> android/app/build.gradle
          fi
      - name: Install dependencies and run tests
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter test
      - name: Build universal release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: noor-quran-masjid-mode-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
