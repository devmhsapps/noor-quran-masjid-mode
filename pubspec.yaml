name: noor_quran_masjid_mode
description: Mueen — Arabic Quran and prayer companion for Android.
publish_to: "none"
version: 1.2.1+16

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  adhan: ^2.0.0-nullsafety.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.3.1
  flutter_tts: ^4.2.3
  hijri: ^3.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/data/quran.json
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf

flutter_launcher_icons:
  android: true
  image_path: assets/images/app_icon.png
  min_sdk_android: 23
